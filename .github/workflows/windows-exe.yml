name: Windows EXE

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Artifact retention days"
        required: false
        default: "14"
  push:
    branches:
      - main
      - feature/integrated-chat-windows-build

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Sync versions
        run: npm run sync-version

      - name: Build Windows app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx tauri build --ci 2>&1 | Tee-Object -FilePath windows-build.log

      - name: List Windows build outputs
        if: always()
        shell: pwsh
        run: |
          Write-Host "Root target outputs:"
          if (Test-Path target) {
            Get-ChildItem -Path target -Recurse -File |
              Where-Object { $_.Extension -in ".exe", ".msi" } |
              Select-Object -ExpandProperty FullName
          }
          Write-Host "src-tauri target outputs:"
          if (Test-Path src-tauri/target) {
            Get-ChildItem -Path src-tauri/target -Recurse -File |
              Where-Object { $_.Extension -in ".exe", ".msi" } |
              Select-Object -ExpandProperty FullName
          }

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Lite-Windows
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/*.exe

      - name: Upload Windows build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Codex-Lite-Windows-Build-Log
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days || 14 }}
          path: windows-build.log
